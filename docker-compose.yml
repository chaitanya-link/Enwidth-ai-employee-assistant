services:
  backend:
    build:
      context: ./backend
    container_name: enwidth-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/chroma_data:/app/chroma_data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: enwidth-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend